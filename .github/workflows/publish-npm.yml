name: publish-npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify version sync (Cargo.toml == package.json == release tag)
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          npm_version=$(node -p "require('./package.json').version")
          if [ "$cargo_version" != "$npm_version" ]; then
            echo "Version mismatch: Cargo.toml=$cargo_version package.json=$npm_version" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            if [ "v$npm_version" != "$tag" ]; then
              echo "Version mismatch: package.json=v$npm_version release tag=$tag" >&2
              exit 1
            fi
          fi

      - name: Smoke-test launcher asset resolution
        run: node -e "process.env.AGENTIC_NPM_BINARY='/bin/true'; require('./bin/agentic.js')" --version

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
