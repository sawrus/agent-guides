name: publish-npm

on:
  release:
    types: [published]
  workflow_dispatch:
  # release.yml calls this after it creates the release: a release created with GITHUB_TOKEN does not start
  # other workflows, so the `release` trigger alone never ran for tagged releases.
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify version sync (Cargo.toml == package.json == release tag)
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          npm_version=$(node -p "require('./package.json').version")
          if [ "$cargo_version" != "$npm_version" ]; then
            echo "Version mismatch: Cargo.toml=$cargo_version package.json=$npm_version" >&2
            exit 1
          fi
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -n "$tag" ]; then
            if [ "v$npm_version" != "$tag" ]; then
              echo "Version mismatch: package.json=v$npm_version release tag=$tag" >&2
              exit 1
            fi
          fi

      - name: Smoke-test launcher asset resolution
        run: node -e "process.env.AGENTIC_NPM_BINARY='/bin/true'; require('./bin/agentic.js')" --version

      - name: Publish to npm
        # Skip a version that is already on npm, so a manual release after the automatic one does not fail.
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping."
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
