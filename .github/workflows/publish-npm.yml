name: publish-npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)." >&2
            exit 1
          fi

      - name: Verify publish artifact
        run: npm pack --dry-run

      - name: Verify npm auth token can access account
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: |
          set +e
          PUBLISH_OUTPUT="$(npm publish --access public --provenance 2>&1)"
          PUBLISH_EXIT_CODE=$?
          set -e

          echo "$PUBLISH_OUTPUT"

          if [ "$PUBLISH_EXIT_CODE" -ne 0 ] && echo "$PUBLISH_OUTPUT" | grep -q "Two-factor authentication or granular access token with bypass 2fa enabled is required"; then
            echo "::error::NPM publish failed because secrets.NPM_TOKEN is not allowed to bypass 2FA for publishing."
            echo "::error::Create an npm Automation token (classic) or a granular access token with package publish permission and bypass 2FA enabled, then update the NPM_TOKEN repository secret."
          fi

          exit "$PUBLISH_EXIT_CODE"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
