name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rustfmt
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Content lint
        run: make lint-content
      - name: Content contract tests
        run: make test-content test-jev-hooks
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned OpenCode SDK for adapter typecheck
        # bowser@2.15.0 (via @aws-sdk/core) is tagged latest, but its tarball returns 404 from the registry.
        run: |
          mkdir -p "$RUNNER_TEMP/agentic-jev-sdk"
          echo '{"private":true,"overrides":{"bowser":"2.14.1"}}' > "$RUNNER_TEMP/agentic-jev-sdk/package.json"
          npm install --prefix "$RUNNER_TEMP/agentic-jev-sdk" --ignore-scripts --no-audit --no-fund @opencode/plugin@2.0.28 typescript@5.8.2 @types/node@22
      - name: OpenCode SDK contract
        run: make test-jev-sdk SDK_DIR="$RUNNER_TEMP/agentic-jev-sdk"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit + integration tests
        run: cargo test --bin agentic && cargo test --test cli
      - name: E2E blackbox (unix)
        if: runner.os != 'Windows'
        run: cargo test --test e2e_blackbox

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage gate (80% lines)
        run: cargo llvm-cov --fail-under-lines 80 --summary-only
