name: Run tests on MR to main

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash \
            ca-certificates \
            coreutils \
            git \
            grep \
            make \
            nodejs \
            npm \
            python3 \
            python3-pip \
            sed

      - name: Check for Python cache artifacts
        run: make check-no-pycache

      - name: Run tests
        run: make test
